services:
  db:
    image: postgres:17-alpine

    env_file:
      - infra/postgres/.env.test

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    env_file:
      - infra/redis/.env.test

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-test:
    build:
      context: ./apps/api
      dockerfile: Dockerfile

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - apps/api/.env.test

    command: pytest