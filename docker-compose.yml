name: pfi

x-common-environment: &common-environment
  ENVIRONMENT: ${ENVIRONMENT:-production}

x-postgres-env-file: &postgres-env-file
  - infra/postgres/.env.${ENVIRONMENT:-production}

x-redis-env-file: &redis-env-file
  - infra/redis/.env.${ENVIRONMENT:-production}

x-api-env-files: &api-env-files
  - apps/api/.env.${ENVIRONMENT:-production}

x-web-env-files: &web-env-files
  - apps/web/.env.${ENVIRONMENT:-production}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: *postgres-env-file
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: *redis-env-file
    expose:
      - "${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  api:
    image: ${DOCKERHUB_USERNAME}/pfi-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: *api-env-files
    environment:
      <<: *common-environment
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - backend

  web:
    image: ${DOCKERHUB_USERNAME}/pfi-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file: *web-env-files
    environment:
      <<: *common-environment
      PORT: "3000"
    ports:
      - "3000:3000" 
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data: